# Sweep da fábrica de geradores (VAE-GAN). O dataset é o que estiver em
# `run:` no config.yaml (ex.: ["dogs"]). 2 agentes (1 por GPU).
# Criar:  wandb sweep sweep.yaml
# Rodar:  CUDA_VISIBLE_DEVICES=0 wandb agent <sweep_id> &
#         CUDA_VISIBLE_DEVICES=1 wandb agent <sweep_id>
# run_cap = TOTAL de modelos (compartilhado pelos 2 agentes); como teto, os
# agentes param sozinhos ao atingi-lo. (Alternativa: wandb agent --count N por agente.)
program: main.py
method: random
run_cap: 10          # total de modelos a treinar no sweep
metric:
  name: val_l1
  goal: minimize
# mata runs ruins cedo: corte único na época 25 — a metade pior (pretas inclusas)
# morre na metade do tempo; a metade melhor (~10 redes) treina as 50 épocas inteiras
early_terminate:
  type: hyperband
  min_iter: 25
  eta: 2
parameters:
  beta:
    distribution: log_uniform_values
    min: 0.001
    max: 0.05
  l_adv:
    distribution: uniform
    min: 0.3
    max: 1.0
  l_perc:
    distribution: uniform
    min: 0.1
    max: 0.5
  # fixos por run de sweep (sobrescrevem o config.yaml via wandb.config)
  resume:
    value: false   # cada receita treina do zero; ckpt de outra receita não serve
