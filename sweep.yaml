# Sweep do vae_gan: 20 runs random, 2 agentes (1 por GPU).
# Criar:  wandb sweep sweep.yaml
# Rodar:  CUDA_VISIBLE_DEVICES=0 wandb agent --count 10 <sweep_id> &
#         CUDA_VISIBLE_DEVICES=1 wandb agent --count 10 <sweep_id>
program: main.py
method: random
metric:
  name: val_l1
  goal: minimize
# mata runs ruins cedo: corte único na época 25 — a metade pior (pretas inclusas)
# morre na metade do tempo; a metade melhor (~10 redes) treina as 50 épocas inteiras
early_terminate:
  type: hyperband
  min_iter: 25
  eta: 2
parameters:
  beta:
    distribution: log_uniform_values
    min: 0.003
    max: 0.1
  l_adv:
    distribution: uniform
    min: 0.3
    max: 1.0
  l_perc:
    distribution: uniform
    min: 0.1
    max: 0.5
  # fixos por run de sweep (sobrescrevem o config.yaml via wandb.config)
  resume:
    value: false   # cada receita treina do zero; ckpt de outra receita não serve
