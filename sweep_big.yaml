# Sweep da rede MAIOR (bloco `dogs_big`, zdim=256). Idêntico ao sweep.yaml,
# exceto a faixa de `beta`: como o KL é SOMADO nas dims, dobrar zdim (128->256)
# ~dobra a magnitude do KL -> a faixa cai ~pela metade pra penalizar na mesma
# escala efetiva. Use com `run: ["dogs_big"]` no config.yaml.
# Criar:  wandb sweep sweep_big.yaml
# Rodar:  CUDA_VISIBLE_DEVICES=0 uv run wandb agent --count 10 <sweep_id> &
#         CUDA_VISIBLE_DEVICES=1 uv run wandb agent --count 10 <sweep_id>
program: main.py
method: random
run_cap: 10          # total de modelos (rede maior é mais cara -> manter enxuto)
metric:
  name: val_l1
  goal: minimize
# corte único na época 25: a metade pior morre cedo, a melhor treina inteiro
early_terminate:
  type: hyperband
  min_iter: 25
  eta: 2
parameters:
  beta:
    distribution: log_uniform_values
    min: 0.0005        # reescalado de 0.001 (metade) p/ zdim 256
    max: 0.02         # mantido (não reescalado): deixa beta chegar alto p/ latente mais liso
  l_adv:
    distribution: uniform
    min: 0.1
    max: 0.3
  l_perc:
    distribution: uniform
    min: 0.1
    max: 0.5
  # fixos por run de sweep (sobrescrevem o config.yaml via wandb.config)
  resume:
    value: false   # cada receita treina do zero; ckpt de outra receita não serve
