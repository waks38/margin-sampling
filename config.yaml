# --- Chassi (genérico) ---
seed: 42

# Lista de experimentos a rodar, em ordem
run: ["classification"]

# --- Blocos por experimento (cada um define sua própria forma) ---
classification:
  model: "simple_net"
  loss: "cross_entropy"
  input_size: 20
  num_classes: 3
  num_samples: 1000
  hidden_size: 64
  batch_size: 32
  learning_rate: 0.001
  epochs: 10